services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ek
      MYSQL_DATABASE: ek
      MYSQL_USER: ek
      MYSQL_PASSWORD: ek
    volumes:
      - db_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ek
      SPRING_DATASOURCE_USERNAME: ek
      SPRING_DATASOURCE_PASSWORD: ek
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db

volumes:
  db_data: